name: Test Free Proxy Connectivity

# 手动触发的测试工作流：在 GitHub Actions runner（海外）上拉取站大爷免费代理，
# 两段式分层测活，精准定位断点在哪一段：
#   第一段：裸 TCP 连接代理端口（不经代理转发），通=「runner -> 代理」链路 OK
#   第二段：TCP 通后经代理访问米游社域名，通=「代理 -> 米游社」链路 OK
#   两段都通 = ALL_OK；第一段断 = runner 连不上代理；第二段断 = 代理连不上米游社
#
# 前置：需在仓库 Settings -> Secrets 添加 ZDAYE_APP_ID / ZDAYE_AKEY。

on:
  workflow_dispatch: {}

jobs:
  test-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install httpx
        run: pip install httpx socksio

      - name: Fetch & probe proxies
        env:
          ZDAYE_APP_ID: ${{ secrets.ZDAYE_APP_ID }}
          ZDAYE_AKEY: ${{ secrets.ZDAYE_AKEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import socket
          import time
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed

          import httpx

          APP_ID = os.environ.get("ZDAYE_APP_ID", "")
          AKEY = os.environ.get("ZDAYE_AKEY", "")
          if not APP_ID or not AKEY:
              print("ERROR: 缺少 secrets ZDAYE_APP_ID / ZDAYE_AKEY")
              raise SystemExit(1)

          API_URL = "http://www.zdopen.com/FreeProxy/Get/"
          API_PARAMS = {
              "app_id": APP_ID, "akey": AKEY, "count": 100, "dalu": 1,
              "level_type": 1, "lastcheck_type": 4, "sleep_type": 3, "return_type": 3,
          }

          # 正确域名：社区签到走 bbs-api.miyoushe.com（不是 bbs.mihoyo.com）
          MIHOYO_URLS = [
              "https://bbs-api.miyoushe.com/apihub/wapi/getUserMissionsState",
              "https://api-takumi.mihoyo.com/event/luna/info?lang=zh-cn&act_id=e202311201442471",
          ]

          def scheme_of(proto):
              if proto in ("socks5", "socks4"):
                  return proto
              return "http"

          # 第一段：裸 TCP 连接代理端口（不经过任何代理转发），纯粹测「runner -> 代理」
          def tcp_connect(ip, port, timeout=6):
              try:
                  with socket.create_connection((ip, port), timeout=timeout):
                      return "tcp_ok"
              except socket.timeout:
                  return "tcp_timeout"
              except ConnectionRefusedError:
                  return "tcp_refused"
              except OSError:
                  return "tcp_error"

          # 第二段：经代理发请求，测「代理 -> 目标站」
          def via_proxy(proxy, url, timeout=8):
              try:
                  with httpx.Client(proxy=proxy, timeout=timeout, follow_redirects=True) as c:
                      r = c.get(url)
                      if r.status_code < 500:
                          return "ok"
                      return f"http_{r.status_code}"
              except httpx.ProxyError:
                  return "proxy_error"
              except httpx.ConnectTimeout:
                  return "connect_timeout"
              except httpx.ReadTimeout:
                  return "read_timeout"
              except httpx.ConnectError:
                  return "connect_error"
              except Exception as e:
                  return f"other:{type(e).__name__}"

          # 直连基准：不经代理直连米游社（测 runner 到米游社本身）
          def direct(url, timeout=12):
              try:
                  with httpx.Client(timeout=timeout, follow_redirects=True) as c:
                      r = c.get(url)
                      return f"ok({r.status_code})" if r.status_code < 500 else f"http_{r.status_code}"
              except Exception as e:
                  return f"fail:{type(e).__name__}"

          def probe(p):
              ip, port = str(p["ip"]), int(p["port"])
              proxy = f'{scheme_of(p.get("protocol", "http"))}://{ip}:{port}'
              tcp = tcp_connect(ip, port)
              if tcp != "tcp_ok":
                  # 第一段就断了：runner 连不上代理
                  return {"proxy": proxy, "protocol": p.get("protocol"), "stage": "stage1_runner_to_proxy_dead", "detail": tcp}
              # 第二段：代理转发到米游社
              res = [via_proxy(proxy, u) for u in MIHOYO_URLS]
              if all(x == "ok" for x in res):
                  return {"proxy": proxy, "protocol": p.get("protocol"), "stage": "ALL_OK", "detail": ""}
              return {"proxy": proxy, "protocol": p.get("protocol"), "stage": "stage2_proxy_to_mihoyo_dead", "detail": "/".join(res)}

          print("=== 直连基准（不经代理，测 runner 到米游社本身）===")
          for u in MIHOYO_URLS:
              print(u, "->", direct(u))
          print()

          # 专项：用户给的关键 IP（两层分开测）
          print("=== 专项 47.95.206.224 ===")
          for port in range(45001, 45011):
              tcp = tcp_connect("47.95.206.224", port)
              if tcp == "tcp_ok":
                  m = via_proxy(f"http://47.95.206.224:{port}", MIHOYO_URLS[0])
                  print(f":{port} tcp=OK via_proxy={m}")
              else:
                  print(f":{port} tcp={tcp}")
          print()

          r = httpx.get(API_URL, params=API_PARAMS, timeout=20)
          data = r.json()
          print(f"[拉取] API code={data.get('code')}")
          proxies = data.get("data", {}).get("proxy_list", [])
          print(f"[拉取] 共 {len(proxies)} 个代理")

          stage_stats = Counter()
          stage1_detail = Counter()
          stage2_detail = Counter()
          usable = []
          with ThreadPoolExecutor(max_workers=30) as ex:
              futs = [ex.submit(probe, p) for p in proxies]
              for f in as_completed(futs):
                  rres = f.result()
                  stage_stats[rres["stage"]] += 1
                  if rres["stage"] == "stage1_runner_to_proxy_dead":
                      stage1_detail[rres["detail"]] += 1
                  elif rres["stage"] == "stage2_proxy_to_mihoyo_dead":
                      stage2_detail[rres["detail"]] += 1
                  elif rres["stage"] == "ALL_OK":
                      usable.append(rres)

          print("\n=== 两段式分层统计 ===")
          for k, v in stage_stats.most_common():
              print(f"{k}: {v}")
          print("\n=== 第一段死因明细（runner->代理 断）===")
          for k, v in stage1_detail.most_common():
              print(f"{k}: {v}")
          print("\n=== 第二段死因明细（代理->米游社 断）===")
          for k, v in stage2_detail.most_common():
              print(f"{k}: {v}")
          print(f"\n=== 可用代理 {len(usable)} 个 ===")
          for r in usable[:30]:
              print(f"{r['proxy']} [{r['protocol']}]")

          json.dump(
              {
                  "fetched": len(proxies),
                  "stage_stats": dict(stage_stats),
                  "stage1_detail": dict(stage1_detail),
                  "stage2_detail": dict(stage2_detail),
                  "usable": [u["proxy"] for u in usable],
              },
              open("proxy_test_result.json", "w", encoding="utf-8"),
              ensure_ascii=False, indent=2,
          )

          lines = ["站大爷免费代理 Actions 两段式分层测活"]
          lines.append(f"拉取代理数: {len(proxies)}")
          for k, v in stage_stats.most_common():
              lines.append(f"{k}: {v}")
          if usable:
              lines.append(f"可用: {len(usable)} 个")
              for r in usable[:10]:
                  lines.append(f"{r['proxy']} [{r['protocol']}]")
          else:
              lines.append("无可用代理")
          with open("result.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          print("\n[result.txt 已生成]")
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-test-result-${{ github.run_id }}
          path: |
            proxy_test_result.json
            result.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Push result via wxpusher
        if: always()
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
        run: |
          if [ -f result.txt ]; then
            CONTENT=$(cat result.txt)
          else
            CONTENT="代理测活未生成结果（脚本可能提前失败，请看 Actions 日志）"
          fi
          CONTENT=$(echo "$CONTENT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          curl -s -X POST "https://wxpusher.zjiecode.com/api/send/message" \
            -H "Content-Type: application/json" \
            -d "{\"appToken\":\"$WXPUSHER_APP_TOKEN\",\"content\":$CONTENT,\"summary\":\"代理连通性测试\",\"contentType\":1,\"uids\":[\"$WXPUSHER_UIDS\"]}"